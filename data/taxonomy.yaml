# Topic taxonomy for awesome-position-papers.
#
# One PRIMARY topic per paper. scripts/tag_topics.py scores every topic with
# these keyword lists (title matches count three times more than abstract
# matches) and, when the venue published its own category, `native` patterns
# give an extra boost. Nothing here is learned or hand-curated per paper: the
# taxonomy is the whole rule set, so retagging is deterministic and reviewable
# by editing this file alone.
#
# Topics are listed roughly from specific to broad; ties go to the earlier one.
#
# `generic_keywords` are the everywhere-a-LLM-words ("LLM", "language model",
# "foundation model"). They score only in the title (generic_title_boost) and
# never from the abstract, because almost every abstract in this corpus mentions
# them. A topic flagged `catch_all` additionally has to outscore the best
# specific topic to win, so generic vocabulary cannot quietly swallow a paper
# that is really about agents, safety, evaluation, society, HCI or fairness.

version: 2
default_topic: models-reasoning
title_boost: 3
generic_title_boost: 2
native_boost: 4

legacy_topic_map:
  Evaluation & benchmarks: Evaluation & benchmarks
  Agents & autonomy: Agents & autonomy
  Safety & alignment: Safety & alignment
  Governance, regulation & policy: Governance & policy
  Scientific discovery & AI for science: AI for science
  Open science, publishing & research culture: Research & open science
  Data, provenance & ownership: Data & compute
  Efficiency, scaling & sustainability: Data & compute
  Foundations & theory: Models, reasoning & theory
  Society, labor & economy: People & society
  Fairness, bias & pluralism: People & society
  Human-AI interaction & usability: People & society
  Multimodal, vision & generative media: Multimodal & generative media
  Language models & reasoning: Models, reasoning & theory
  Other & cross-cutting: Research & open science

paper_topic_overrides:
  2604.21169: Evaluation & benchmarks
  2405.18236: Multimodal & generative media

