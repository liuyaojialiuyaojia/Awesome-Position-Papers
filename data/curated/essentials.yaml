rubric:
  scope: "Forty papers selected after reading the abstracts of 82 candidates shortlisted from 638 public rows."
  include: "A specific, consequential claim supported by a framework, formal analysis, empirical evidence, or a concrete research program."
  balance: "Cover the main debates across all ten topics without repeating the same thesis; recency and citation count do not determine inclusion."
  evidence: "Abstract-level editorial selection, not a full-text quality certification; each note explains the contribution rather than restating the title."

papers:
  - id: "2509.19590"
    why: "Turns benchmark scores into explicit inferences and shows empirically how evaluator assumptions can change conclusions."
  - id: "2503.01747"
    why: "Demonstrates that small-benchmark CLT error bars can sharply understate uncertainty, then offers practical Bayesian and frequentist replacements."
  - id: "2410.08385"
    why: "Documents overlap reporting across 30 models, making a concrete transparency requirement for interpreting public benchmark results."
  - id: "2508.14927"
    why: "Uses game-theoretic analysis to explain why strategic systems can invalidate tests that assume evaluation and deployment behavior match."

  - id: "x643bbd6fbefe"
    why: "Connects agent permissions to OAuth and OpenID Connect, offering an implementable path to scoped, auditable delegation."
  - id: "2505.21298"
    why: "Rebuilds LLM multi-agent research around established ideas of autonomy, environments, coordination, communication, and emergence."
  - id: "2404.02113"
    why: "Provides empirical evidence that lifetime-wide hyperparameter tuning can hide which methods actually support continual learning."
  - id: "2406.04268"
    why: "Defines open-endedness through novelty and human learnability, linking a concrete capability target to superhuman-AI safety."

  - id: "x094699ce5d94"
    why: "Separates three alignment ideals and shows how one intervention can help under one threat model while harming another."
  - id: "2404.10271"
    why: "Makes aggregation of conflicting human feedback a central alignment problem and supplies social-choice theory as its conceptual toolkit."
  - id: "x7f532addc2f1"
    why: "Develops a systemic alternative to takeover scenarios: incremental automation can mutually reinforce economic, cultural, and political disempowerment."
  - id: "x14aa3a1b7885"
    why: "Translates lessons from software security into standardized flaw reports, disclosure programs, safe harbors, and coordination infrastructure."
  - id: "2606.07612"
    why: "Introduces evidence levels and a diagnostic checklist to keep ambiguous anthropomorphic findings from driving deployment or regulation prematurely."

  - id: "2412.00836"
    why: "Makes model access a distinct governance decision, with recommendations for evaluators, labs, governments, and international bodies."
  - id: "x108d8a45a26d"
    why: "Grounds a limit on consequential AI decision-making in legal due process, interpretability limits, and trade-secret barriers."
  - id: "2404.13861"
    why: "Challenges anthropomorphic accountability by contrasting two theories of agency and reframing AI as the outcome of political processes."
  - id: "x1e6b13efb117"
    why: "Turns ICCPR Article 19 into checkable policy criteria and applies them to eight providers' disinformation rules."

  - id: "2405.18095"
    why: "Uses concrete physics examples to show where ML improves causal inference and where emulation or generated labels create uncontrolled bias."
  - id: "2504.02234"
    why: "Makes a bounded case for exploratory social simulations, grounded in empirical comparisons and five tractable methodological challenges."
  - id: "xc59d1e0c2bba"
    why: "Defines the validation gap in multi-agent social simulations and proposes shared benchmarks, open data, and reproducible protocols."
  - id: "x32b3aab8cde5"
    why: "Uses failures across protein, genomic, and single-cell models to argue for theory-driven research and institutional incentives beyond scale."

  - id: "2403.07918"
    why: "Supplies a marginal-risk framework that separates open models' added misuse risk from risks already present in existing technologies."
  - id: "2502.03689"
    why: "Names six traps in AGI-centered research and replaces a contested singular goal with specificity, pluralism, and inclusion."
  - id: "x0a5e7b67b5dc"
    why: "Combines automated and human evaluations to support limited LLM assistance in review while retaining human involvement throughout."
  - id: "x896bf7ce3f25"
    why: "Enumerates 24 capabilities required for review, creating a structured basis for benchmarking and a cautious case against general automation."

  - id: "2211.04325"
    why: "Quantifies the finite stock of public human text and frames synthetic data, transfer, and efficiency as responses to scaling limits."
  - id: "2503.03150"
    why: "Disentangles eight meanings of model collapse and reweights the literature by how closely its assumptions match real conditions."
  - id: "2510.01645"
    why: "Uses 1,322 privacy papers and case studies to redirect attention from memorization to lifecycle and sociotechnical harms."
  - id: "xfa7efb61b6d2"
    why: "Provides a game-theoretic model in which efficiency increases total energy use, making rebound analysis a quantitative requirement."

  - id: "x4f3f956e5df0"
    why: "Combines cross-domain evidence with a shared-representation hypothesis, selective pressures, limitations, and counterexamples."
  - id: "x53363f5dd75a"
    why: "Recasts LLMs as approximate knowledge sources inside verifier-guided planning rather than autonomous planners."
  - id: "2310.08540"
    why: "Tests the ICL-gradient-descent analogy on naturally pretrained models and identifies behavioral differences that leave equivalence unresolved."
  - id: "2405.01964"
    why: "Uses mathematical examples and three case studies to show why equal test loss does not imply equivalent LLM behavior."

  - id: "xc7e724b27964"
    why: "Formalizes three kinds of pluralism and matching benchmarks, with evidence that standard alignment can reduce distributional pluralism."
  - id: "2404.08592"
    why: "Offers stochastic allocation procedures that treat randomness as a principled way to balance competing claims to scarce resources."
  - id: "x88ece42a5e09"
    why: "Analyzes 607 XAI user studies to expose missing baselines, weak reproducibility, and poor fidelity to real applications."
  - id: "2608.07505"
    why: "Connects RLHF's approval objective to sycophancy evidence, then proposes longitudinal metrics, user-selected modes, and non-paternalistic challenge."

  - id: "2402.01103"
    why: "Shows how composing smaller generative models can improve data efficiency, out-of-distribution generalization, and construction of unseen tasks."
  - id: "2505.19614"
    why: "Formalizes many-to-many modality relationships as a pipeline-wide source of training uncertainty and unreliable evaluation."
  - id: "2402.17139"
    why: "Lays out how video generation could serve as a common interface for planning, agency, computation, and simulation."
